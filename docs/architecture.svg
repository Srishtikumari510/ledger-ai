<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <text x="60" y="60" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="-0.5">LedgerAI · Architecture</text>
  <text x="60" y="88" fill="#6b7280" font-size="13" letter-spacing="2">DOCUMENT INTELLIGENCE PIPELINE</text>

  <!-- Row 1: Client layer -->
  <g transform="translate(60,130)">
    <rect width="1080" height="90" rx="10" fill="#12161c" stroke="#1f2937"/>
    <text x="24" y="30" fill="#10b981" font-size="11" letter-spacing="2" font-weight="700">LAYER 1 · CLIENTS</text>
    <g transform="translate(24,48)">
      <rect width="240" height="30" rx="6" fill="#0a0d12" stroke="#1f2937"/>
      <text x="14" y="20" fill="#e5e7eb" font-size="12" font-weight="600">🌐 Landing page (HTML/CSS/JS)</text>
    </g>
    <g transform="translate(280,48)">
      <rect width="240" height="30" rx="6" fill="#0a0d12" stroke="#1f2937"/>
      <text x="14" y="20" fill="#e5e7eb" font-size="12" font-weight="600">📊 Dashboard (Jinja2)</text>
    </g>
    <g transform="translate(536,48)">
      <rect width="240" height="30" rx="6" fill="#0a0d12" stroke="#1f2937"/>
      <text x="14" y="20" fill="#e5e7eb" font-size="12" font-weight="600">📖 Swagger / OpenAPI</text>
    </g>
    <g transform="translate(792,48)">
      <rect width="264" height="30" rx="6" fill="#0a0d12" stroke="#1f2937"/>
      <text x="14" y="20" fill="#e5e7eb" font-size="12" font-weight="600">🔌 REST clients (curl / Postman)</text>
    </g>
  </g>

  <line x1="600" y1="220" x2="600" y2="250" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: API layer -->
  <g transform="translate(60,250)">
    <rect width="1080" height="80" rx="10" fill="#12161c" stroke="#1f2937"/>
    <text x="24" y="30" fill="#10b981" font-size="11" letter-spacing="2" font-weight="700">LAYER 2 · API</text>
    <g transform="translate(24,48)">
      <rect width="1032" height="24" rx="4" fill="#0a0d12" stroke="#1f2937"/>
      <text x="14" y="17" fill="#e5e7eb" font-size="12" font-weight="600">FastAPI  ·  POST /api/v1/documents/process  ·  GET /api/v1/documents/{name}  ·  GET /api/v1/documents  ·  GET /api/v1/health</text>
    </g>
  </g>

  <line x1="600" y1="330" x2="600" y2="360" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: Orchestration -->
  <g transform="translate(60,360)">
    <rect width="1080" height="70" rx="10" fill="#12161c" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="24" y="30" fill="#10b981" font-size="11" letter-spacing="2" font-weight="700">LAYER 3 · ORCHESTRATION</text>
    <text x="24" y="54" fill="#e5e7eb" font-size="13" font-weight="600">document_service.py — coordinates validation → OCR → extraction → financial validation → persistence</text>
  </g>

  <!-- Row 4: Pipeline services (4 cards) -->
  <g transform="translate(60,460)">
    <rect width="255" height="140" rx="10" fill="#12161c" stroke="#1f2937"/>
    <text x="16" y="26" fill="#10b981" font-size="10" letter-spacing="2" font-weight="700">STEP 1</text>
    <text x="16" y="50" fill="#ffffff" font-size="14" font-weight="700">File Validation</text>
    <text x="16" y="74" fill="#9ca3af" font-size="11">• Type (PDF/JPG/PNG)</text>
    <text x="16" y="92" fill="#9ca3af" font-size="11">• Size, readability</text>
    <text x="16" y="110" fill="#9ca3af" font-size="11">• Page count ≤ 3</text>
    <text x="16" y="128" fill="#6b7280" font-size="10">PASS / FAILED</text>
  </g>

  <g transform="translate(335,460)">
    <rect width="255" height="140" rx="10" fill="#12161c" stroke="#1f2937"/>
    <text x="16" y="26" fill="#10b981" font-size="10" letter-spacing="2" font-weight="700">STEP 2</text>
    <text x="16" y="50" fill="#ffffff" font-size="14" font-weight="700">OCR / Text Extract</text>
    <text x="16" y="74" fill="#9ca3af" font-size="11">• pdfplumber (native)</text>
    <text x="16" y="92" fill="#9ca3af" font-size="11">• Tesseract (fallback)</text>
    <text x="16" y="110" fill="#9ca3af" font-size="11">• Poppler (PDF→img)</text>
    <text x="16" y="128" fill="#6b7280" font-size="10">Per-page text</text>
  </g>

  <g transform="translate(610,460)">
    <rect width="255" height="140" rx="10" fill="#12161c" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="16" y="26" fill="#10b981" font-size="10" letter-spacing="2" font-weight="700">STEP 3</text>
    <text x="16" y="50" fill="#ffffff" font-size="14" font-weight="700">LLM Extraction</text>
    <text x="16" y="74" fill="#9ca3af" font-size="11">• Google Gemini</text>
    <text x="16" y="92" fill="#9ca3af" font-size="11">• Strict JSON schema</text>
    <text x="16" y="110" fill="#9ca3af" font-size="11">• Page-level evidence</text>
    <text x="16" y="128" fill="#6b7280" font-size="10">Structured fields</text>
  </g>

  <g transform="translate(885,460)">
    <rect width="255" height="140" rx="10" fill="#12161c" stroke="#1f2937"/>
    <text x="16" y="26" fill="#10b981" font-size="10" letter-spacing="2" font-weight="700">STEP 4</text>
    <text x="16" y="50" fill="#ffffff" font-size="14" font-weight="700">Financial Validation</text>
    <text x="16" y="74" fill="#9ca3af" font-size="11">• Deterministic rules</text>
    <text x="16" y="92" fill="#9ca3af" font-size="11">• Formula + operands</text>
    <text x="16" y="110" fill="#9ca3af" font-size="11">• Variance + status</text>
    <text x="16" y="128" fill="#6b7280" font-size="10">PASS / FAIL / N/A</text>
  </g>

  <line x1="315" y1="530" x2="335" y2="530" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="530" x2="610" y2="530" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="865" y1="530" x2="885" y2="530" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="600" y1="600" x2="600" y2="630" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 5: Persistence -->
  <g transform="translate(60,630)">
    <rect width="520" height="90" rx="10" fill="#12161c" stroke="#1f2937"/>
    <text x="24" y="30" fill="#10b981" font-size="11" letter-spacing="2" font-weight="700">LAYER 5 · PERSISTENCE</text>
    <text x="24" y="56" fill="#e5e7eb" font-size="13" font-weight="600">Repository · SQLAlchemy ORM</text>
    <text x="24" y="76" fill="#9ca3af" font-size="11">SQLite (dev)  ·  PostgreSQL-ready (prod)</text>
  </g>

  <g transform="translate(620,630)">
    <rect width="520" height="90" rx="10" fill="#12161c" stroke="#1f2937"/>
    <text x="24" y="30" fill="#10b981" font-size="11" letter-spacing="2" font-weight="700">LAYER 6 · OUTPUT</text>
    <text x="24" y="56" fill="#e5e7eb" font-size="13" font-weight="600">Consistent structured JSON</text>
    <text x="24" y="76" fill="#9ca3af" font-size="11">document_name · file_validation · extracted_data · validation · metadata</text>
  </g>

  <text x="60" y="800" fill="#6b7280" font-size="11">Runtime: Python 3.12 · Uvicorn · Docker · Render</text>
  <text x="60" y="820" fill="#6b7280" font-size="11">Deployment: https://ledger-ai-y8ff.onrender.com</text>
  <text x="1140" y="820" fill="#6b7280" font-size="11" text-anchor="end">LedgerAI · 2026</text>
</svg>
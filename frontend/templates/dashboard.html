<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Â· LedgerAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/landing.css" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand">
      <span class="brand-mark">&#9670;</span>
      <span class="brand-name">LedgerAI</span>
    </a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/docs" target="_blank">API Docs</a>
    </div>
    <a href="/" class="nav-cta">&larr; Back to Home</a>
  </div>
</nav>

<main class="app-main">
  <div class="app-header">
    <h1>Document Dashboard</h1>
    <p>Upload financial documents for AI-powered extraction &amp; validation.</p>
  </div>

  <section class="app-card">
    <h2>Process a Document</h2>
    <form id="uploadForm">
      <div class="row">
        <label for="documentType">Document Type</label>
        <select id="documentType" name="document_type" required>
          <option value="invoice">Invoice</option>
          <option value="balance_sheet">Balance Sheet</option>
          <option value="profit_and_loss">Profit &amp; Loss</option>
          <option value="cash_flow_statement">Cash Flow Statement</option>
        </select>
      </div>
      <div class="row">
        <label for="fileInput">File (PDF / JPG / PNG, max 3 pages)</label>
        <input type="file" id="fileInput" name="file" accept=".pdf,.jpg,.jpeg,.png" required />
      </div>
      <button type="submit" id="processBtn" class="btn-primary-app">Process Document</button>
    </form>
    <div id="statusMsg" class="status-msg"></div>
  </section>

  <section class="app-card">
    <div class="card-head-row">
      <h2>Processed Documents</h2>
      <button id="refreshBtn" class="btn-secondary-app">Refresh</button>
    </div>
    <table id="docsTable">
      <thead>
        <tr>
          <th>Document Name</th>
          <th>Type</th>
          <th>Status</th>
          <th>Processed At</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="docsBody">
        <tr><td colspan="5" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script src="/static/js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Result - Document Intelligence</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <header>
    <h1>Document Result</h1>
    <p class="subtitle"><a href="/">â† Back to Dashboard</a></p>
  </header>

  <main>
    <section class="card">
      <h2 id="docTitle">Loading...</h2>
      <div id="metaBlock" class="meta-grid"></div>
    </section>

    <section class="card">
      <h2>File Validation</h2>
      <div id="fileValidation"></div>
    </section>

    <section class="card">
      <h2>Extracted Fields</h2>
      <div id="extractedFields"></div>
    </section>

    <section class="card">
      <h2>Line Items / Tables</h2>
      <div id="lineItems"></div>
    </section>

    <section class="card">
      <h2>Financial Validations</h2>
      <div id="validationBlock"></div>
    </section>

    <section class="card">
      <h2>Processing Metadata</h2>
      <div id="metadataBlock"></div>
    </section>

    <section class="card">
      <button id="toggleRaw" class="secondary">Show Raw JSON</button>
      <pre id="rawJson" class="hidden"></pre>
    </section>
  </main>

  <script src="/static/js/result.js"></script>
</body>
</html>
